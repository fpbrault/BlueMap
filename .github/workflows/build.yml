name: CI - Minecraft 1.21.1 / NeoForge

on:
  pull_request:
    branches:
      - "v5.23-fpb"
  workflow_dispatch:

jobs:
  test:
    name: "Java 21 tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Core/common tests
        run: ./gradlew :core:spotlessCheck :common:spotlessCheck :neoforge:spotlessCheck :core:test :common:test --stacktrace

  build-neoforge:
    name: "Build NeoForge 1.21.1"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Build NeoForge and ModelLoaders artifacts
        run: ./gradlew :neoforge:release :model-loaders-addon:shadowJar --stacktrace
      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bluemap-v5.23-mc1.21.1-neoforge
          path: |
            build/release/*
            compat/model-loaders-addon/build/libs/*.jar
